<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商城本地演示</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f4f7fb; }
    body { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0 0 8px; } .muted { color: #60708a; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 24px 0; }
    .card { background: white; border: 1px solid #e1e8f2; border-radius: 14px; padding: 18px; box-shadow: 0 8px 24px #203b5d0d; }
    .price { color: #d34b35; font-size: 20px; font-weight: 700; margin: 12px 0; }
    button { border: 0; border-radius: 8px; padding: 9px 13px; color: white; background: #2557d6; cursor: pointer; }
    button.secondary { background: #5f6f86; } .row { display:flex; justify-content:space-between; gap: 12px; align-items:center; }
    #cart { min-height: 40px; }
  </style>
</head>
<body>
  <p class="muted">Java 商城 · 本地演示模式</p>
  <h1>商品浏览与下单</h1>
  <p class="muted">使用内存数据，不连接外部注册中心、数据库、缓存或支付服务。</p>
  <div id="products" class="grid"></div>
  <section class="card">
    <div class="row"><h2>购物车</h2><button class="secondary" onclick="placeOrder()">模拟下单</button></div>
    <div id="cart" class="muted">购物车为空</div>
  </section>
  <script>
    const money = value => `¥${Number(value).toFixed(2)}`;
    async function load() {
      const products = await fetch('/api/demo/products').then(r => r.json());
      document.querySelector('#products').innerHTML = products.map(p => `<article class="card"><div class="muted">${p.category}</div><h3>${p.name}</h3><div class="price">${money(p.price)}</div><p class="muted">库存 ${p.stock}</p><button onclick="add(${p.id})">加入购物车</button></article>`).join('');
      refreshCart();
    }
    async function add(productId) { await fetch('/api/demo/cart', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({productId, quantity:1}) }); refreshCart(); }
    async function refreshCart() { const cart = await fetch('/api/demo/cart').then(r => r.json()); document.querySelector('#cart').innerHTML = cart.length ? cart.map(i => `<p>${i.product.name} × ${i.quantity} · ${money(Number(i.product.price) * i.quantity)}</p>`).join('') : '购物车为空'; }
    async function placeOrder() { const result = await fetch('/api/demo/order', {method:'POST'}).then(r => r.json()); alert(result.total > 0 ? `订单 ${result.orderId} 已创建，金额 ${money(result.total)}` : '请先加入商品'); refreshCart(); }
    load();
  </script>
</body>
</html>

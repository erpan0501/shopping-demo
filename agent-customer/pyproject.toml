[project]
name = "agent-custumer"
version = "0.1.0"
description = "FastAPI and LangGraph customer-service Agent for a shopping platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-deepseek>=1.1.0",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "redis>=7.2.0",
    "uvicorn>=0.52.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
